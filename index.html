<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trạm thu thập ảnh AI</title>
    
    <!-- Tailwind & UI Framework -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Các bộ xử lý AI của Google MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { background: #f1f5f9; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); }
        #preview-canvas { max-width: 100%; border-radius: 0.75rem; background: #000; display: none; }
        #camera-stream { width: 100%; border-radius: 0.75rem; transform: scaleX(-1); background: #000; display: none; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center min-h-screen">

    <div class="glass w-full max-w-4xl p-6 rounded-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-blue-700 uppercase tracking-wide"><i class="fas fa-camera-retro mr-2"></i> Trạm Thu Thập Ảnh AI</h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- CỘT 1: THÔNG TIN HỌC SINH & XÁC THỰC MÃ PIN -->
            <div class="space-y-4">
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <h3 class="font-bold text-blue-800 mb-3 text-sm uppercase"><i class="fas fa-user-graduate mr-1"></i> 1. Thông tin học sinh</h3>
                    
                    <label class="block text-xs font-bold text-slate-600 mb-1">Chọn Lớp</label>
                    <select id="inp-class" class="w-full p-2.5 mb-3 rounded-lg border font-bold text-slate-700 shadow-sm" onchange="filterStudents()">
                        <option value="">-- Đang tải danh sách lớp từ Sheets --</option>
                    </select>

                    <label class="block text-xs font-bold text-slate-600 mb-1">Họ và Tên (Lọc thông minh)</label>
                    <input type="text" id="inp-name" list="student-list" placeholder="Gõ tên học sinh..." class="w-full p-2.5 mb-3 rounded-lg border text-sm shadow-sm" onchange="autoFillInfo()">
                    <datalist id="student-list"></datalist>

                    <div class="grid grid-cols-2 gap-3 mb-2">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Ngày sinh</label>
                            <input type="text" id="inp-dob" readonly class="w-full p-2.5 rounded-lg border bg-slate-200 text-sm font-bold text-slate-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Mã PIN (6 Số)</label>
                            <div class="relative">
                                <input type="password" id="inp-pin" maxlength="6" inputmode="numeric" placeholder="Nhập PIN..." oninput="checkPinLive()" class="w-full p-2.5 rounded-lg border border-slate-300 text-sm font-bold text-center tracking-widest bg-white focus:border-blue-500 focus:outline-none transition shadow-sm" disabled>
                                <i id="icon-hs-check" class="fas fa-check-circle absolute right-3 top-3 text-emerald-500 text-lg hidden"></i>
                            </div>
                        </div>
                    </div>
                    <!-- Trường ẩn lưu mã học sinh ngầm để gửi về GAS -->
                    <input type="hidden" id="inp-id">
                </div>

                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                    <h3 class="font-bold text-emerald-800 mb-3 text-sm uppercase"><i class="fas fa-cloud-upload-alt mr-1"></i> 2. Thao Tác Lưu Trữ</h3>
                    <button id="btn-upload" onclick="uploadToServer()" disabled class="w-full bg-slate-400 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center">
                        <i class="fas fa-upload mr-2 text-xl"></i> ĐẨY ẢNH LÊN HỆ THỐNG
                    </button>
                    <p class="text-xs text-center text-slate-500 mt-2">*Yêu cầu: Nhập đúng Mã PIN (có tích xanh) và Đã hoàn tất chụp ảnh.</p>
                </div>
            </div>

            <!-- CỘT 2: CAMERA & AI (FACE MESH + BACKGROUND REMOVAL) -->
            <div class="flex flex-col items-center bg-slate-800 p-4 rounded-xl border-4 border-slate-700 relative">
                
                <div class="flex flex-col w-full mb-3 space-y-2">
                    <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-lg border border-slate-600">
                        <span class="text-white text-xs font-bold uppercase"><i class="fas fa-video text-cyan-400 mr-2 text-sm"></i> Nguồn Camera</span>
                        <select id="camera-select" class="bg-slate-700 text-white text-xs p-1.5 rounded border border-slate-500 max-w-[160px] outline-none cursor-pointer" onchange="switchCamera()">
                            <option value="">-- Mặc định --</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-between w-full bg-slate-900 p-2.5 rounded-lg border border-slate-600">
                        <span class="text-white text-xs font-bold uppercase"><i class="fas fa-vr-cardboard text-cyan-400 mr-2 text-sm"></i> Quét khuôn mặt (AR)</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-ar" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-cyan-500 shadow-inner"></div>
                        </label>
                    </div>
                </div>

                <video id="camera-stream" autoplay playsinline></video>
                <canvas id="preview-canvas" class="w-full rounded-lg shadow-lg border border-slate-600"></canvas>
                
                <div id="ai-loading" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center hidden rounded-lg z-10">
                    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <span class="text-white font-bold text-sm tracking-widest animate-pulse">AI ĐANG XỬ LÝ...</span>
                </div>

                <!-- Cụm nút điều khiển tương thích hoàn toàn Mobile & PC -->
                <div class="w-full flex flex-col sm:flex-row gap-2 mt-4 z-20">
                    <button id="btn-toggle-cam" onclick="toggleCamera()" class="w-full sm:flex-1 bg-slate-600 hover:bg-slate-500 text-white font-bold py-3 sm:py-2.5 rounded-lg text-sm transition shadow-md flex items-center justify-center">
                        <i class="fas fa-power-off mr-2"></i> Bật Cam
                    </button>
                    <button id="btn-capture" onclick="captureAndProcessAI()" class="w-full sm:flex-[2] bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 sm:py-2.5 rounded-lg shadow-lg text-sm transition flex items-center justify-center hidden">
                        <i class="fas fa-magic mr-2"></i> Tách nền & Chụp
                    </button>
                    <button id="btn-retake" onclick="retakePhoto()" class="w-full sm:flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 sm:py-2.5 rounded-lg text-sm transition shadow-md flex items-center justify-center hidden">
                        <i class="fas fa-redo mr-2"></i> Quét lại
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        // ==========================================
        // 1. CẤU HÌNH WEBHOOK (GOOGLE APPS SCRIPT)
        // ==========================================
        const GAS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxLigjyjSnhjH0cljv2ss-tfkBjrN5acf9PcUXgjmKH6-yZf6nAuyoxW-iuvknQlgxWYw/exec"; 

        let ALL_CLASSES_DATA = {};
        let currentStudents = [];

        window.onload = () => { 
            fetchStudentsFromSheets(); 
            loadCameraDevices();
        };

        function fetchStudentsFromSheets() {
            fetch(GAS_WEBHOOK_URL + "?action=getStudentsData")
            .then(res => res.json())
            .then(response => {
                if (response.status === "success") {
                    ALL_CLASSES_DATA = response.data;
                    const classSelect = document.getElementById("inp-class");
                    classSelect.innerHTML = '<option value="">-- Bấm chọn Lớp --</option>';
                    Object.keys(ALL_CLASSES_DATA).forEach(cls => {
                        let opt = document.createElement("option"); opt.value = cls; opt.innerText = cls;
                        classSelect.appendChild(opt);
                    });
                }
            });
        }

        function filterStudents() {
            const cls = document.getElementById("inp-class").value;
            const dataList = document.getElementById("student-list");
            dataList.innerHTML = ""; 
            document.getElementById("inp-name").value = ""; 
            clearInfo();
            if(!cls) return;
            currentStudents = ALL_CLASSES_DATA[cls] || [];
            currentStudents.forEach(s => {
                let opt = document.createElement("option"); opt.value = s.name; dataList.appendChild(opt);
            });
        }

        function autoFillInfo() {
            const name = document.getElementById("inp-name").value.trim();
            const student = currentStudents.find(s => s.name.toLowerCase() === name.toLowerCase());
            const pinInput = document.getElementById("inp-pin");
            const iconCheck = document.getElementById("icon-hs-check");

            if (student) {
                document.getElementById("inp-dob").value = student.dob;
                document.getElementById("inp-id").value = student.id;
                
                pinInput.disabled = false;
                pinInput.value = "";
                pinInput.classList.replace("border-emerald-500", "border-slate-300");
                iconCheck.classList.add("hidden");
                checkEnableUpload();
            } else { 
                clearInfo(); 
                pinInput.disabled = true;
                pinInput.value = "";
                iconCheck.classList.add("hidden");
            }
        }
        
        function clearInfo() { 
            document.getElementById("inp-dob").value = ""; 
            document.getElementById("inp-id").value = ""; 
            document.getElementById("inp-pin").value = "";
            document.getElementById("inp-pin").disabled = true;
            document.getElementById("icon-hs-check").classList.add("hidden");
        }

        function checkPinLive() {
            const name = document.getElementById("inp-name").value.trim();
            const pin = document.getElementById("inp-pin").value;
            const student = currentStudents.find(s => s.name.toLowerCase() === name.toLowerCase());
            const iconCheck = document.getElementById("icon-hs-check");
            const pinInput = document.getElementById("inp-pin");
            
            if (!student) return;

            if (pin.length === 6) {
                if (pin === student.pin.toString()) {
                    iconCheck.classList.remove("hidden");
                    pinInput.classList.replace("border-slate-300", "border-emerald-500");
                } else {
                    iconCheck.classList.add("hidden");
                    pinInput.classList.replace("border-emerald-500", "border-slate-300");
                }
            } else {
                iconCheck.classList.add("hidden");
                pinInput.classList.replace("border-emerald-500", "border-slate-300");
            }
            checkEnableUpload();
        }

        function checkEnableUpload() {
            const btn = document.getElementById("btn-upload");
            const hasChecked = !document.getElementById("icon-hs-check").classList.contains("hidden");
            
            if (finalImageBase64 && hasChecked) {
                btn.disabled = false;
                btn.classList.replace('bg-slate-400', 'bg-emerald-600');
                btn.classList.add('hover:bg-emerald-500');
            } else {
                btn.disabled = true;
                btn.classList.replace('bg-emerald-600', 'bg-slate-400');
                btn.classList.remove('hover:bg-emerald-500');
            }
        }

        // ==========================================
        // 2. CAMERA MANAGEMENT & AI
        // ==========================================
        const videoElement = document.getElementById('camera-stream');
        const canvasElement = document.getElementById('preview-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        let currentStream = null;
        let finalImageBase64 = null;
        let isCaptured = false;
        let isARActive = true;
        let isCameraOn = false;

        document.getElementById('toggle-ar').addEventListener('change', (e) => { isARActive = e.target.checked; });

        async function loadCameraDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                const cameraSelect = document.getElementById('camera-select');
                const currentVal = cameraSelect.value;
                cameraSelect.innerHTML = '';
                if (videoDevices.length === 0) return cameraSelect.innerHTML = '<option value="">Không tìm thấy Cam</option>';

                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Camera ${index + 1}`;
                    if (device.deviceId === currentVal) option.selected = true;
                    cameraSelect.appendChild(option);
                });
            } catch (err) {}
        }

        function switchCamera() { if (currentStream && isCameraOn) startCamera(); }

        const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        faceMesh.onResults(onFaceMeshResults);

        const selfieSegmentation = new SelfieSegmentation({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`});
        selfieSegmentation.setOptions({ modelSelection: 1 });
        selfieSegmentation.onResults(onSelfieSegmentationResults);

        function toggleCamera() {
            if (isCameraOn) stopCamera();
            else startCamera();
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            videoElement.srcObject = null;
            canvasElement.style.display = "none";
            document.getElementById("btn-capture").classList.add("hidden");
            document.getElementById("btn-retake").classList.add("hidden");
            
            const btnToggle = document.getElementById("btn-toggle-cam");
            btnToggle.innerHTML = '<i class="fas fa-power-off mr-2"></i> Bật Cam';
            btnToggle.classList.replace('bg-red-600', 'bg-slate-600');
            btnToggle.classList.replace('hover:bg-red-500', 'hover:bg-slate-500');
            isCameraOn = false;
        }

        async function startCamera() {
            try {
                if (currentStream) currentStream.getTracks().forEach(track => track.stop());
                const selectedDeviceId = document.getElementById('camera-select').value;
                const constraints = {
                    video: {
                        width: { ideal: 1280 }, height: { ideal: 720 },
                        ...(selectedDeviceId ? { deviceId: { exact: selectedDeviceId } } : { facingMode: "user" })
                    }
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    document.getElementById("btn-capture").classList.remove("hidden");
                    canvasElement.style.display = "block";
                    isCaptured = false;
                    loadCameraDevices();
                    
                    const btnToggle = document.getElementById("btn-toggle-cam");
                    btnToggle.innerHTML = '<i class="fas fa-power-off mr-2"></i> Tắt Cam';
                    btnToggle.classList.replace('bg-slate-600', 'bg-red-600');
                    btnToggle.classList.replace('hover:bg-slate-500', 'hover:bg-red-500');
                    isCameraOn = true;

                    processRealTimeAR(); 
                };
            } catch (err) { Swal.fire('Lỗi', 'Cấp quyền Camera!', 'error'); }
        }

        async function processRealTimeAR() {
            if (!isCaptured && videoElement.videoWidth > 0 && isCameraOn) await faceMesh.send({image: videoElement});
            if (!isCaptured && isCameraOn) requestAnimationFrame(processRealTimeAR);
        }

        function onFaceMeshResults(results) {
            if (isCaptured) return; 
            canvasElement.width = videoElement.videoWidth; canvasElement.height = videoElement.videoHeight;
            canvasCtx.save(); canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            const isFrontCamera = !document.getElementById('camera-select').value; 
            if(isFrontCamera) { canvasCtx.translate(canvasElement.width, 0); canvasCtx.scale(-1, 1); }
            
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            if (isARActive && results.multiFaceLandmarks) {
                for (const landmarks of results.multiFaceLandmarks) {
                    drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#C0C0C070', lineWidth: 1}); 
                    drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#00FFFF', lineWidth: 2});     
                    drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#00FFFF', lineWidth: 2});      
                    drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {color: '#E0E0E0', lineWidth: 1.5});   
                    drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#FF3030', lineWidth: 1.5});        
                }
            }
            canvasCtx.restore();
        }

        async function captureAndProcessAI() {
            if (!videoElement.srcObject) return Swal.fire('Cảnh báo', 'Vui lòng bật Cam!', 'warning');
            document.getElementById("ai-loading").classList.remove("hidden");
            isCaptured = true; 
            await selfieSegmentation.send({ image: videoElement });
        }

        function onSelfieSegmentationResults(results) {
            const w = results.image.width; const h = results.image.height;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w; tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(results.segmentationMask, 0, 0, w, h);
            
            const imgData = tempCtx.getImageData(0, 0, w, h).data;
            let minX = w, minY = h, maxX = 0, maxY = 0;
            
            for (let y = 0; y < h; y+=4) {
                for (let x = 0; x < w; x+=4) {
                    if (imgData[(y * w + x) * 4 + 3] > 128) {
                        if (x < minX) minX = x; if (y < minY) minY = y;
                        if (x > maxX) maxX = x; if (y > maxY) maxY = y;
                    }
                }
            }
            
            const padding = 40;
            minX = Math.max(0, minX - padding); minY = Math.max(0, minY - padding);
            maxX = Math.min(w, maxX + padding); maxY = Math.min(h, maxY + padding);
            const cropW = maxX - minX; const cropH = maxY - minY;
            
            if (cropW <= 0 || cropH <= 0) {
                document.getElementById("ai-loading").classList.add("hidden");
                retakePhoto();
                return Swal.fire('Lỗi AI', 'Không nhận diện được người!', 'error');
            }

            canvasElement.width = cropW; canvasElement.height = cropH;
            canvasCtx.fillStyle = "#0f4c81"; canvasCtx.fillRect(0, 0, cropW, cropH);

            const fgCanvas = document.createElement('canvas');
            fgCanvas.width = cropW; fgCanvas.height = cropH;
            const fgCtx = fgCanvas.getContext('2d');
            
            const isFrontCamera = !document.getElementById('camera-select').value; 
            if(isFrontCamera) { fgCtx.translate(cropW, 0); fgCtx.scale(-1, 1); }
            
            fgCtx.drawImage(results.segmentationMask, w - maxX, minY, cropW, cropH, 0, 0, cropW, cropH);
            fgCtx.globalCompositeOperation = 'source-in';
            fgCtx.drawImage(results.image, w - maxX, minY, cropW, cropH, 0, 0, cropW, cropH);

            canvasCtx.drawImage(fgCanvas, 0, 0);
            finalImageBase64 = canvasElement.toDataURL('image/jpeg', 0.85);
            
            document.getElementById("ai-loading").classList.add("hidden");
            document.getElementById("btn-capture").classList.add("hidden");
            document.getElementById("btn-retake").classList.remove("hidden");
            
            checkEnableUpload(); 
        }

        function retakePhoto() {
            finalImageBase64 = null; isCaptured = false; 
            document.getElementById("btn-capture").classList.remove("hidden");
            document.getElementById("btn-retake").classList.add("hidden");
            checkEnableUpload(); 
            processRealTimeAR(); 
        }

        // ==========================================
        // 3. TẢI ẢNH LÊN MÁY CHỦ (SAU KHI ĐÃ ĐỦ ĐIỀU KIỆN)
        // ==========================================
        async function uploadToServer() {
            const cls = document.getElementById("inp-class").value;
            const name = document.getElementById("inp-name").value;
            const studentId = document.getElementById("inp-id").value;

            if (!cls || !name || !studentId) return Swal.fire('Lỗi', 'Vui lòng chọn đầy đủ thông tin học sinh!', 'warning');
            if (!finalImageBase64) return Swal.fire('Lỗi', 'Chưa có ảnh xử lý từ AI!', 'error');

            Swal.fire({
                title: 'Đang đẩy ảnh lên Drive...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const imgPayload = { 
                    image_data: finalImageBase64, 
                    className: cls, 
                    ten_hs: name, 
                    ma_hs: studentId 
                };
                
                const imgResponse = await fetch(GAS_WEBHOOK_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(imgPayload) 
                });
                const imgData = await imgResponse.json();

                if (imgData.status === 'success') {
                    Swal.fire('Thành công', 'Đã lưu ảnh vào Drive và cập nhật Cột G Sheet lớp!', 'success')
                    .then(() => { 
                        retakePhoto(); 
                        document.getElementById("inp-name").value = ""; 
                        clearInfo(); 
                        fetchStudentsFromSheets(); 
                    });
                } else {
                    Swal.fire('Lỗi từ Server', imgData.msg || 'Gửi ảnh thất bại', 'error');
                }
            } catch (err) {
                Swal.fire('Lỗi mạng', 'Không thể kết nối đến Google Apps Script.', 'error');
            }
        }
    </script>
</body>
</html>
