<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trạm Thu Thập Ảnh AI - THPT Ngô Quyền</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%); font-family: 'Inter', sans-serif; color: #334155; min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06); }
    .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    #preview-canvas { max-width: 100%; border-radius: 0.75rem; background: #000; display: none; }
    #camera-stream { width: 100%; border-radius: 0.75rem; transform: scaleX(-1); background: #000; display: none; }
    .loader { border: 3px solid rgba(59, 130, 246, 0.1); border-top: 3px solid #3b82f6; border-radius: 50%; width: 45px; height: 45px; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="flex flex-col items-center justify-start pb-24">

  <!-- NÚT ĐIỀU HƯỚNG & HEADER (CÓ NÚT QUAY VỀ CỔNG ĐIỂM DANH) -->
  <header class="glass-header text-slate-800 p-4 sticky top-0 z-50 flex items-center justify-between max-w-4xl w-full mx-auto rounded-b-2xl mb-6">
    <div class="flex items-center space-x-2">
        <div class="bg-cyan-500/10 p-2 rounded-lg border border-cyan-200"><i class="fas fa-camera-retro text-cyan-600"></i></div>
        <span class="font-bold text-sm tracking-wider text-cyan-700">TRẠM ẢNH AI</span>
    </div>
    
    <!-- LIÊN KẾT VỀ LẠI CỔNG ĐIỂM DANH (Pro thay URL của Cổng Điểm Danh vào đây) -->
    <button type="button" onclick="window.location.href='https://script.google.com/macros/s/AKfycbzXJSim4qjU_zbXW27wkOcr00ikrasL259WGbH2XLso5mKoUfi7x-VEckaTox5ECcYruQ/exec'" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl text-xs transition shadow-md flex items-center space-x-1.5">
        <i class="fas fa-arrow-left"></i><span>Quay lại Cổng Điểm Danh</span>
    </button>
  </header>

  <div id="loading-screen" class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-md w-full mx-auto">
    <div class="loader mb-4"></div><p class="text-cyan-600 font-semibold text-sm animate-pulse" id="loading-msg">KẾT NỐI HỆ THỐNG...</p>
  </div>

  <div id="step-ai-photo" class="hidden flex-1 p-4 flex flex-col items-center max-w-4xl w-full mx-auto">
      <div class="glass-card w-full p-6 rounded-2xl mb-6 shadow-xl border border-cyan-100">
          <div class="text-center mb-6">
              <h1 class="text-2xl font-extrabold text-cyan-700 uppercase tracking-wide"><i class="fas fa-robot mr-2"></i> Trạm Thu Thập Ảnh Thẻ AI</h1>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
              <!-- CỘT 1: NHẬP LIỆU -->
              <div class="space-y-4">
                  <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                      <h3 class="font-bold text-blue-800 mb-3 text-sm uppercase"><i class="fas fa-user-graduate mr-1"></i> 1. Thông tin học sinh</h3>
                      
                      <label class="block text-xs font-bold text-slate-600 mb-1">Chọn Lớp (Gõ để lọc)</label>
                      <input type="text" id="ai-inp-class" list="ai-class-list" placeholder="Gõ hoặc chọn lớp..." class="w-full p-2.5 mb-3 rounded-lg border font-bold text-slate-700 shadow-sm bg-white" oninput="aiFilterStudents()" onchange="aiFilterStudents()">
                      <datalist id="ai-class-list"></datalist>

                      <label class="block text-xs font-bold text-slate-600 mb-1">Họ và Tên (Gõ tên để lọc)</label>
                      <input type="text" id="ai-inp-name" list="ai-student-list" placeholder="Gõ tên học sinh..." class="w-full p-2.5 mb-3 rounded-lg border text-sm shadow-sm bg-white" oninput="aiAutoFillInfo()" onchange="aiAutoFillInfo()">
                      <datalist id="ai-student-list"></datalist>

                      <div class="grid grid-cols-2 gap-3 mb-2">
                          <div>
                              <label class="block text-xs font-bold text-slate-600 mb-1">Ngày sinh</label>
                              <input type="text" id="ai-inp-dob" readonly class="w-full p-2.5 rounded-lg border bg-slate-200 text-sm font-bold text-slate-500">
                          </div>
                          <div>
                              <label class="block text-xs font-bold text-slate-600 mb-1">Mã PIN (6 Số)</label>
                              <div class="relative">
                                  <input type="password" id="ai-inp-pin" maxlength="6" inputmode="numeric" placeholder="Nhập PIN..." oninput="aiCheckPinLive()" class="w-full p-2.5 rounded-lg border border-slate-300 text-sm font-bold text-center tracking-widest bg-white focus:border-cyan-500 focus:outline-none transition shadow-sm" disabled>
                                  <i id="ai-icon-hs-check" class="fas fa-check-circle absolute right-3 top-3 text-emerald-500 text-lg hidden"></i>
                              </div>
                          </div>
                      </div>
                      <input type="hidden" id="ai-inp-id">
                  </div>

                  <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                      <h3 class="font-bold text-emerald-800 mb-3 text-sm uppercase"><i class="fas fa-cloud-upload-alt mr-1"></i> 2. Thao Tác Lưu Trữ</h3>
                      <button id="ai-btn-upload" onclick="aiUploadToServer()" disabled class="w-full bg-slate-400 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center">
                          <i class="fas fa-upload mr-2 text-xl"></i> ĐẨY ẢNH LÊN DRIVE
                      </button>
                  </div>
              </div>

              <!-- CỘT 2: CAMERA AI -->
              <div class="flex flex-col items-center bg-slate-800 p-4 rounded-xl border-4 border-slate-700 relative">
                  <div class="flex flex-col w-full mb-3 space-y-2">
                      <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-lg border border-slate-600">
                          <span class="text-white text-xs font-bold uppercase"><i class="fas fa-video text-cyan-400 mr-2"></i> Camera</span>
                          <select id="ai-camera-select" class="bg-slate-700 text-white text-xs p-1.5 rounded border border-slate-500 outline-none" onchange="aiSwitchCamera()"><option value="">-- Mặc định --</option></select>
                      </div>
                      <div class="flex items-center justify-between w-full bg-slate-900 p-2.5 rounded-lg border border-slate-600">
                          <span class="text-white text-xs font-bold uppercase"><i class="fas fa-vr-cardboard text-cyan-400 mr-2"></i> Lưới AR khuôn mặt</span>
                          <label class="relative inline-flex items-center cursor-pointer">
                              <input type="checkbox" id="ai-toggle-ar" class="sr-only peer" checked>
                              <div class="w-11 h-6 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-cyan-500 shadow-inner"></div>
                          </label>
                      </div>
                  </div>

                  <video id="camera-stream" autoplay playsinline></video>
                  <canvas id="preview-canvas" class="w-full rounded-lg shadow-lg border border-slate-600"></canvas>
                  
                  <div id="ai-loading" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center hidden rounded-lg z-10">
                      <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                      <span class="text-white font-bold text-sm tracking-widest animate-pulse">AI ĐANG XỬ LÝ...</span>
                  </div>

                  <div class="w-full grid grid-cols-2 sm:flex sm:flex-row gap-2 mt-4 z-20">
                      <button id="ai-btn-toggle-cam" onclick="aiToggleCamera()" class="col-span-1 sm:flex-1 bg-slate-600 hover:bg-slate-500 text-white font-bold py-2.5 rounded-lg text-xs sm:text-sm transition shadow-md flex items-center justify-center">
                          <i class="fas fa-power-off mr-1"></i> Bật Cam
                      </button>
                      <button id="ai-btn-capture" onclick="aiCaptureAndProcessAI()" class="col-span-1 sm:flex-[2] bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 rounded-lg shadow-lg text-xs sm:text-sm transition flex items-center justify-center hidden">
                          <i class="fas fa-magic mr-1"></i> Tách nền & Chụp
                      </button>
                      <button id="ai-btn-save-local" onclick="aiSaveImageLocally()" class="col-span-1 sm:flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-xs sm:text-sm transition shadow-md flex items-center justify-center hidden">
                          <i class="fas fa-download mr-1"></i> Lưu ảnh
                      </button>
                      <button id="ai-btn-retake" onclick="aiRetakePhoto()" class="col-span-2 sm:flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-lg text-xs sm:text-sm transition shadow-md flex items-center justify-center hidden">
                          <i class="fas fa-redo mr-1"></i> Quét lại
                      </button>
                  </div>
              </div>
          </div>
      </div>
  </div>
  <script>
    let appData = { classes: [] };
    let aiCurrentStudents = [];
    let aiFinalImageBase64 = null;
    let aiIsCaptured = false;
    let aiIsARActive = true;
    let aiIsCameraOn = false;
    let aiCurrentStream = null;

    document.addEventListener("DOMContentLoaded", () => {
        google.script.run.withSuccessHandler(res => {
            appData.classes = res.classes || [];
            document.getElementById("loading-screen").classList.add("hidden");
            document.getElementById("loading-screen").classList.remove("flex");
            document.getElementById("step-ai-photo").classList.remove("hidden");
            aiInitPhotoStation();
        }).withFailureHandler(err => {
            Swal.fire('Lỗi', err.message, 'error');
        }).getAppInitData();
    });

    function aiInitPhotoStation() {
        const classList = document.getElementById("ai-class-list");
        classList.innerHTML = '';
        if (appData.classes.length > 0) {
            appData.classes.forEach(cls => { let opt = document.createElement("option"); opt.value = cls; classList.appendChild(opt); });
        }
        aiLoadCameraDevices();
    }

    function aiFilterStudents() {
        const clsInput = document.getElementById("ai-inp-class").value.trim();
        const dataList = document.getElementById("ai-student-list");
        dataList.innerHTML = ""; document.getElementById("ai-inp-name").value = ""; aiClearInfo();
        if(!clsInput) return;
        
        google.script.run.withSuccessHandler(res => {
            if(res && res.students) {
                aiCurrentStudents = res.students;
                aiCurrentStudents.forEach(s => { let opt = document.createElement("option"); opt.value = s.name; dataList.appendChild(opt); });
            }
        }).getClassDataRawStudents(clsInput);
    }

    function aiAutoFillInfo() {
        const name = document.getElementById("ai-inp-name").value.trim();
        const student = aiCurrentStudents.find(s => s.name.toLowerCase() === name.toLowerCase());
        const pinInput = document.getElementById("ai-inp-pin"); const iconCheck = document.getElementById("ai-icon-hs-check");

        if (student) {
            document.getElementById("ai-inp-dob").value = student.dob || ""; document.getElementById("ai-inp-id").value = student.maHS || student.id || "";
            pinInput.disabled = false; pinInput.value = ""; pinInput.classList.replace("border-emerald-500", "border-slate-300"); iconCheck.classList.add("hidden");
            aiCheckEnableUpload();
        } else { 
            aiClearInfo(); 
        }
    }
    
    function aiClearInfo() { 
        document.getElementById("ai-inp-dob").value = ""; document.getElementById("ai-inp-id").value = ""; 
        document.getElementById("ai-inp-pin").value = ""; document.getElementById("ai-inp-pin").disabled = true; document.getElementById("ai-icon-hs-check").classList.add("hidden");
    }

    function aiCheckPinLive() {
        const name = document.getElementById("ai-inp-name").value.trim(); const pin = document.getElementById("ai-inp-pin").value;
        const student = aiCurrentStudents.find(s => s.name.toLowerCase() === name.toLowerCase());
        const iconCheck = document.getElementById("ai-icon-hs-check"); const pinInput = document.getElementById("ai-inp-pin");
        if (!student) return;
        if (pin.length === 6) {
            if (pin === student.pin.toString()) { iconCheck.classList.remove("hidden"); pinInput.classList.replace("border-slate-300", "border-emerald-500"); } 
            else { iconCheck.classList.add("hidden"); pinInput.classList.replace("border-emerald-500", "border-slate-300"); }
        } else { iconCheck.classList.add("hidden"); pinInput.classList.replace("border-emerald-500", "border-slate-300"); }
        aiCheckEnableUpload();
    }

    function aiCheckEnableUpload() {
        const btn = document.getElementById("ai-btn-upload"); const hasChecked = !document.getElementById("ai-icon-hs-check").classList.contains("hidden");
        if (aiFinalImageBase64 && hasChecked) { btn.disabled = false; btn.classList.replace('bg-slate-400', 'bg-emerald-600'); btn.classList.add('hover:bg-emerald-500'); } 
        else { btn.disabled = true; btn.classList.replace('bg-emerald-600', 'bg-slate-400'); btn.classList.remove('hover:bg-emerald-500'); }
    }

    const videoElement = document.getElementById('camera-stream'); const canvasElement = document.getElementById('preview-canvas'); const canvasCtx = canvasElement.getContext('2d');
    document.getElementById('ai-toggle-ar').addEventListener('change', (e) => { aiIsARActive = e.target.checked; });

    async function aiLoadCameraDevices() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices(); const videoDevices = devices.filter(device => device.kind === 'videoinput');
            const cameraSelect = document.getElementById('ai-camera-select'); cameraSelect.innerHTML = '';
            if (videoDevices.length === 0) return cameraSelect.innerHTML = '<option value="">Không tìm thấy Cam</option>';
            videoDevices.forEach((device, index) => { const option = document.createElement('option'); option.value = device.deviceId; option.text = device.label || `Camera ${index + 1}`; cameraSelect.appendChild(option); });
        } catch (err) {}
    }

    function aiSwitchCamera() { if (aiCurrentStream && aiIsCameraOn) aiStartCamera(); }

    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 }); faceMesh.onResults(aiOnFaceMeshResults);

    const selfieSegmentation = new SelfieSegmentation({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`});
    selfieSegmentation.setOptions({ modelSelection: 1 }); selfieSegmentation.onResults(aiOnSelfieSegmentationResults);

    function aiToggleCamera() { if (aiIsCameraOn) aiStopCamera(); else aiStartCamera(); }

    function aiStopCamera() {
        if (aiCurrentStream) { aiCurrentStream.getTracks().forEach(track => track.stop()); aiCurrentStream = null; }
        videoElement.srcObject = null; canvasElement.style.display = "none";
        document.getElementById("ai-btn-capture").classList.add("hidden"); document.getElementById("ai-btn-save-local").classList.add("hidden"); document.getElementById("ai-btn-retake").classList.add("hidden");
        const btnToggle = document.getElementById("ai-btn-toggle-cam"); btnToggle.innerHTML = '<i class="fas fa-power-off mr-1"></i> Bật Cam'; btnToggle.classList.replace('bg-red-600', 'bg-slate-600'); aiIsCameraOn = false;
    }

    async function aiStartCamera() {
        try {
            if (aiCurrentStream) aiCurrentStream.getTracks().forEach(track => track.stop());
            const selectedDeviceId = document.getElementById('ai-camera-select').value;
            const constraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 }, ...(selectedDeviceId ? { deviceId: { exact: selectedDeviceId } } : { facingMode: "user" }) } };
            aiCurrentStream = await navigator.mediaDevices.getUserMedia(constraints); videoElement.srcObject = aiCurrentStream;
            videoElement.onloadedmetadata = () => {
                videoElement.play(); document.getElementById("ai-btn-capture").classList.remove("hidden"); canvasElement.style.display = "block"; aiIsCaptured = false;
                const btnToggle = document.getElementById("ai-btn-toggle-cam"); btnToggle.innerHTML = '<i class="fas fa-power-off mr-1"></i> Tắt Cam'; btnToggle.classList.replace('bg-slate-600', 'bg-red-600'); aiIsCameraOn = true; aiProcessRealTimeAR(); 
            };
        } catch (err) { Swal.fire('Lỗi', 'Cấp quyền Camera thất bại!', 'error'); }
    }

    async function aiProcessRealTimeAR() {
        if (!aiIsCaptured && videoElement.videoWidth > 0 && aiIsCameraOn) await faceMesh.send({image: videoElement});
        if (!aiIsCaptured && aiIsCameraOn) requestAnimationFrame(aiProcessRealTimeAR);
    }

    function aiOnFaceMeshResults(results) {
        if (aiIsCaptured) return; 
        canvasElement.width = videoElement.videoWidth; canvasElement.height = videoElement.videoHeight;
        canvasCtx.save(); canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        const isFrontCamera = !document.getElementById('ai-camera-select').value; 
        if(isFrontCamera) { canvasCtx.translate(canvasElement.width, 0); canvasCtx.scale(-1, 1); }
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        
        if (aiIsARActive && results.multiFaceLandmarks) {
            for (const landmarks of results.multiFaceLandmarks) {
                drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#C0C0C070', lineWidth: 1}); drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#00FFFF', lineWidth: 2});     
                drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#00FFFF', lineWidth: 2}); drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {color: '#E0E0E0', lineWidth: 1.5});   
                drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#FF3030', lineWidth: 1.5});        
            }
        }
        canvasCtx.restore();
    }

    async function aiCaptureAndProcessAI() {
        if (!videoElement.srcObject) return Swal.fire('Cảnh báo', 'Vui lòng bật Cam!', 'warning');
        document.getElementById("ai-loading").classList.remove("hidden"); aiIsCaptured = true; await selfieSegmentation.send({ image: videoElement });
    }

    function aiOnSelfieSegmentationResults(results) {
        const w = results.image.width; const h = results.image.height;
        const tempCanvas = document.createElement('canvas'); tempCanvas.width = w; tempCanvas.height = h; const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(results.segmentationMask, 0, 0, w, h); const imgData = tempCtx.getImageData(0, 0, w, h).data;
        let minX = w, minY = h, maxX = 0, maxY = 0;
        for (let y = 0; y < h; y+=4) { for (let x = 0; x < w; x+=4) { if (imgData[(y * w + x) * 4 + 3] > 128) { if (x < minX) minX = x; if (y < minY) minY = y; if (x > maxX) maxX = x; if (y > maxY) maxY = y; } } }
        
        const padding = 40; minX = Math.max(0, minX - padding); minY = Math.max(0, minY - padding); maxX = Math.min(w, maxX + padding); maxY = Math.min(h, maxY + padding);
        const cropW = maxX - minX; const cropH = maxY - minY;
        if (cropW <= 0 || cropH <= 0) { document.getElementById("ai-loading").classList.add("hidden"); aiRetakePhoto(); return Swal.fire('Lỗi AI', 'Không nhận diện được người!', 'error'); }

        canvasElement.width = cropW; canvasElement.height = cropH;
        canvasCtx.fillStyle = "#0f4c81"; canvasCtx.fillRect(0, 0, cropW, cropH);
        const fgCanvas = document.createElement('canvas'); fgCanvas.width = cropW; fgCanvas.height = cropH; const fgCtx = fgCanvas.getContext('2d');
        const isFrontCamera = !document.getElementById('ai-camera-select').value; 
        if(isFrontCamera) { fgCtx.translate(cropW, 0); fgCtx.scale(-1, 1); }
        fgCtx.drawImage(results.segmentationMask, w - maxX, minY, cropW, cropH, 0, 0, cropW, cropH);
        fgCtx.globalCompositeOperation = 'source-in'; fgCtx.drawImage(results.image, w - maxX, minY, cropW, cropH, 0, 0, cropW, cropH);

        canvasCtx.drawImage(fgCanvas, 0, 0); aiFinalImageBase64 = canvasElement.toDataURL('image/jpeg', 0.85);
        document.getElementById("ai-loading").classList.add("hidden"); document.getElementById("ai-btn-capture").classList.add("hidden");
        document.getElementById("ai-btn-save-local").classList.remove("hidden"); document.getElementById("ai-btn-retake").classList.remove("hidden");
        aiCheckEnableUpload(); 
    }

    function aiSaveImageLocally() {
        if (!aiFinalImageBase64) return;
        const studentName = document.getElementById("ai-inp-name").value.trim() || "hocsinh"; const a = document.createElement('a');
        a.href = aiFinalImageBase64; a.download = `AnhThe_${studentName}.jpg`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    function aiRetakePhoto() {
        aiFinalImageBase64 = null; aiIsCaptured = false; document.getElementById("ai-btn-capture").classList.remove("hidden");
        document.getElementById("ai-btn-save-local").classList.add("hidden"); document.getElementById("ai-btn-retake").classList.add("hidden");
        aiCheckEnableUpload(); aiProcessRealTimeAR(); 
    }

    function aiUploadToServer() {
        const clsInput = document.getElementById("ai-inp-class").value.trim(); const name = document.getElementById("ai-inp-name").value; const studentId = document.getElementById("ai-inp-id").value;
        if (!clsInput || !name || !studentId) return Swal.fire('Lỗi', 'Vui lòng chọn đầy đủ thông tin học sinh!', 'warning');
        if (!aiFinalImageBase64) return Swal.fire('Lỗi', 'Chưa có ảnh xử lý từ AI!', 'error');

        Swal.fire({ title: 'Đang đẩy ảnh lên Drive...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

        google.script.run.withSuccessHandler(res => {
            if (res.status === 'success') {
                Swal.fire('Thành công', 'Đã lưu ảnh vào Drive và cập nhật Cột G Sheet lớp!', 'success').then(() => { aiRetakePhoto(); document.getElementById("ai-inp-name").value = ""; aiClearInfo(); });
            } else { Swal.fire('Lỗi từ Server', res.msg || 'Gửi ảnh thất bại', 'error'); }
        }).withFailureHandler(err => { Swal.fire('Lỗi', err.message, 'error'); })({ image_data: aiFinalImageBase64, className: clsInput, ten_hs: name, ma_hs: studentId });
    }
  </script>
</body>
</html>
