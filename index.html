<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trạm Thu Thập Ảnh AI - THPT Ngô Quyền</title>
    
    <!-- Tailwind & UI Framework -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Google AI MediaPipe (Tách phông nền tự động) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { background: #f1f5f9; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); }
        #preview-canvas { max-width: 100%; border-radius: 0.75rem; background: #0f4c81; display: none; }
        #camera-stream { width: 100%; border-radius: 0.75rem; transform: scaleX(-1); background: #000; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center min-h-screen">

    <div class="glass w-full max-w-4xl p-6 rounded-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-blue-700 uppercase tracking-wide"><i class="fas fa-camera-retro mr-2"></i> Trạm Thu Thập Ảnh AI</h1>
            <p class="text-slate-500 text-sm mt-1">Đồng bộ trực tiếp Google Sheets - Tự động tách phông thẻ học sinh</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- CỘT 1: THÔNG TIN HỌC SINH & LỌC THÔNG MINH -->
            <div class="space-y-4">
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <h3 class="font-bold text-blue-800 mb-3 text-sm uppercase"><i class="fas fa-user-graduate mr-1"></i> 1. Thông tin học sinh</h3>
                    
                    <label class="block text-xs font-bold text-slate-600 mb-1">Chọn Lớp</label>
                    <select id="inp-class" class="w-full p-2.5 mb-3 rounded-lg border font-bold text-slate-700 shadow-sm" onchange="filterStudents()">
                        <option value="">-- Đang tải danh sách lớp từ Sheets --</option>
                    </select>

                    <label class="block text-xs font-bold text-slate-600 mb-1">Họ và Tên (Lọc thông minh)</label>
                    <input type="text" id="inp-name" list="student-list" placeholder="Gõ tên học sinh..." class="w-full p-2.5 mb-3 rounded-lg border text-sm shadow-sm" onchange="autoFillInfo()">
                    <datalist id="student-list"></datalist>

                    <div class="grid grid-cols-2 gap-3 mb-2">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Ngày sinh</label>
                            <input type="text" id="inp-dob" readonly class="w-full p-2.5 rounded-lg border bg-slate-200 text-sm font-bold text-slate-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Mã Học Sinh</label>
                            <input type="text" id="inp-id" readonly class="w-full p-2.5 rounded-lg border bg-slate-200 text-sm font-bold text-slate-500">
                        </div>
                    </div>
                </div>

                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                    <h3 class="font-bold text-emerald-800 mb-3 text-sm uppercase"><i class="fas fa-cloud-upload-alt mr-1"></i> 2. Thao Tác Lưu Trữ</h3>
                    <button id="btn-upload" onclick="uploadToServer()" disabled class="w-full bg-slate-400 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center">
                        <i class="fas fa-upload mr-2 text-xl"></i> ĐẨY ẢNH LÊN HỆ THỐNG
                    </button>
                    <p class="text-xs text-center text-slate-500 mt-2">*Hệ thống tự động lưu vào Drive và gắn link vào Cột G Sheet lớp.</p>
                </div>
            </div>

            <!-- CỘT 2: CAMERA & AI TÁCH PHÔNG -->
            <div class="flex flex-col items-center bg-slate-800 p-4 rounded-xl border-4 border-slate-700 relative">
                <video id="camera-stream" autoplay playsinline></video>
                <canvas id="preview-canvas"></canvas>
                
                <div id="ai-loading" class="absolute inset-0 bg-slate-900/80 flex flex-col items-center justify-center hidden rounded-lg">
                    <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-2"></div>
                    <span class="text-white font-bold text-sm tracking-widest animate-pulse">AI ĐANG TÁCH PHÔNG...</span>
                </div>

                <div class="w-full flex space-x-2 mt-4">
                    <button onclick="startCamera()" class="flex-1 bg-slate-600 hover:bg-slate-500 text-white font-bold py-2.5 rounded-lg text-sm transition">
                        <i class="fas fa-video mr-1"></i> Bật Cam
                    </button>
                    <button id="btn-capture" onclick="captureAndProcessAI()" class="flex-[2] bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg shadow-lg text-sm transition hidden">
                        <i class="fas fa-magic mr-1"></i> Tách nền & Chụp
                    </button>
                    <button id="btn-retake" onclick="retakePhoto()" class="flex-1 bg-red-500 hover:bg-red-400 text-white font-bold py-2.5 rounded-lg text-sm transition hidden">
                        <i class="fas fa-redo"></i> Chụp lại
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CẤU HÌNH WEBHOOK URL CỦA GOOGLE APPS SCRIPT
        // ==========================================
        const GAS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyyqyPxijGka_yA-em9dRFc3p-DR4GrbivoyeuZaFZ3UAsK44d06EAM08lmrO82hccHPg/exec"; 
       
        let ALL_CLASSES_DATA = {};
        let currentStudents = [];

        // Tải dữ liệu học sinh từ Google Sheets thông qua API doGet
        window.onload = () => {
            fetchStudentsFromSheets();
        };

        function fetchStudentsFromSheets() {
            Swal.fire({
                title: 'Đang đồng bộ dữ liệu lớp...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            fetch(GAS_WEBHOOK_URL + "?action=getStudentsData")
            .then(res => res.json())
            .then(response => {
                Swal.close();
                if (response.status === "success") {
                    ALL_CLASSES_DATA = response.data;
                    const classSelect = document.getElementById("inp-class");
                    classSelect.innerHTML = '<option value="">-- Bấm chọn Lớp --</option>';
                    
                    Object.keys(ALL_CLASSES_DATA).forEach(cls => {
                        let opt = document.createElement("option");
                        opt.value = cls; 
                        opt.innerText = cls;
                        classSelect.appendChild(opt);
                    });
                } else {
                    Swal.fire('Lỗi', 'Không thể lấy dữ liệu từ Google Sheets', 'error');
                }
            })
            .catch(err => {
                Swal.close();
                Swal.fire('Lỗi Kết Nối', 'Không kết nối được với GAS Webhook. Kiểm tra lại URL.', 'error');
            });
        }

        function filterStudents() {
            const cls = document.getElementById("inp-class").value;
            const dataList = document.getElementById("student-list");
            dataList.innerHTML = "";
            document.getElementById("inp-name").value = "";
            clearInfo();
            if(!cls) return;

            currentStudents = ALL_CLASSES_DATA[cls] || [];
            currentStudents.forEach(s => {
                let opt = document.createElement("option");
                opt.value = s.name; 
                dataList.appendChild(opt);
            });
        }

        function autoFillInfo() {
            const name = document.getElementById("inp-name").value.trim();
            const student = currentStudents.find(s => s.name.toLowerCase() === name.toLowerCase());
            if (student) {
                document.getElementById("inp-dob").value = student.dob;
                document.getElementById("inp-id").value = student.id;
            } else { 
                clearInfo(); 
            }
        }

        function clearInfo() {
            document.getElementById("inp-dob").value = ""; 
            document.getElementById("inp-id").value = "";
        }

        // ==========================================
        // CAMERA & AI TÁCH PHÔNG NỀN (MEDIAPIPE)
        // ==========================================
        const videoElement = document.getElementById('camera-stream');
        const canvasElement = document.getElementById('preview-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        let finalImageBase64 = null;
        let isProcessing = false;

        const selfieSegmentation = new SelfieSegmentation({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
        }});
        selfieSegmentation.setOptions({ modelSelection: 1 });
        selfieSegmentation.onResults(onAIResults);

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: "user" } });
                videoElement.srcObject = stream;
                document.getElementById("btn-capture").classList.remove("hidden");
            } catch (err) {
                Swal.fire('Lỗi Camera', 'Không thể truy cập camera. Vui lòng cấp quyền!', 'error');
            }
        }

        async function captureAndProcessAI() {
            if (!videoElement.srcObject) return Swal.fire('Cảnh báo', 'Vui lòng bật Camera trước!', 'warning');
            document.getElementById("ai-loading").classList.remove("hidden");
            isProcessing = true;
            await selfieSegmentation.send({ image: videoElement });
        }

        function onAIResults(results) {
            if(!isProcessing) return;
            const w = results.image.width;
            const h = results.image.height;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w; tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(results.segmentationMask, 0, 0, w, h);
            
            const imgData = tempCtx.getImageData(0, 0, w, h).data;
            let minX = w, minY = h, maxX = 0, maxY = 0;
            
            for (let y = 0; y < h; y+=4) {
                for (let x = 0; x < w; x+=4) {
                    const alpha = imgData[(y * w + x) * 4 + 3];
                    if (alpha > 128) {
                        if (x < minX) minX = x;
                        if (y < minY) minY = y;
                        if (x > maxX) maxX = x;
                        if (y > maxY) maxY = y;
                    }
                }
            }
            
            const padding = 30;
            minX = Math.max(0, minX - padding); minY = Math.max(0, minY - padding);
            maxX = Math.min(w, maxX + padding); maxY = Math.min(h, maxY + padding);
            const cropW = maxX - minX; const cropH = maxY - minY;
            
            if (cropW <= 0 || cropH <= 0) {
                document.getElementById("ai-loading").classList.add("hidden");
                isProcessing = false;
                return Swal.fire('Lỗi AI', 'Không tìm thấy người trong khung hình!', 'error');
            }

            canvasElement.width = cropW;
            canvasElement.height = cropH;

            // Đổ phông xanh chuẩn thẻ học sinh #0f4c81
            canvasCtx.fillStyle = "#0f4c81";
            canvasCtx.fillRect(0, 0, cropW, cropH);

            const fgCanvas = document.createElement('canvas');
            fgCanvas.width = cropW; fgCanvas.height = cropH;
            const fgCtx = fgCanvas.getContext('2d');
            
            fgCtx.translate(cropW, 0);
            fgCtx.scale(-1, 1);
            fgCtx.drawImage(results.segmentationMask, w - maxX, minY, cropW, cropH, 0, 0, cropW, cropH);
            
            fgCtx.globalCompositeOperation = 'source-in';
            fgCtx.drawImage(results.image, w - maxX, minY, cropW, cropH, 0, 0, cropW, cropH);

            canvasCtx.drawImage(fgCanvas, 0, 0);

            finalImageBase64 = canvasElement.toDataURL('image/jpeg', 0.85);
            
            videoElement.style.display = "none";
            canvasElement.style.display = "block";
            document.getElementById("ai-loading").classList.add("hidden");
            document.getElementById("btn-capture").classList.add("hidden");
            document.getElementById("btn-retake").classList.remove("hidden");
            
            document.getElementById("btn-upload").disabled = false;
            document.getElementById("btn-upload").classList.replace('bg-slate-400', 'bg-emerald-600');
            document.getElementById("btn-upload").classList.add('hover:bg-emerald-500');
            isProcessing = false;
        }

        function retakePhoto() {
            finalImageBase64 = null;
            canvasElement.style.display = "none";
            videoElement.style.display = "block";
            document.getElementById("btn-capture").classList.remove("hidden");
            document.getElementById("btn-retake").classList.add("hidden");
            
            document.getElementById("btn-upload").disabled = true;
            document.getElementById("btn-upload").classList.replace('bg-emerald-600', 'bg-slate-400');
            document.getElementById("btn-upload").classList.remove('hover:bg-emerald-500');
        }

        // Gửi dữ liệu về GAS Webhook
        function uploadToServer() {
            const cls = document.getElementById("inp-class").value;
            const name = document.getElementById("inp-name").value;
            const studentId = document.getElementById("inp-id").value;

            if (!cls || !name || !studentId) {
                return Swal.fire('Lỗi', 'Vui lòng chọn đầy đủ Lớp và Học sinh!', 'warning');
            }
            if (!finalImageBase64) {
                return Swal.fire('Lỗi', 'Chưa có ảnh xử lý từ AI!', 'error');
            }

            const payload = {
                image_data: finalImageBase64,
                className: cls,
                ten_hs: name,
                ma_hs: studentId
            };

            Swal.fire({
                title: 'Đang đẩy ảnh lên Drive...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            fetch(GAS_WEBHOOK_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    Swal.fire('Thành công', 'Đã lưu ảnh vào Drive và cập nhật Cột G Sheet lớp!', 'success')
                    .then(() => { retakePhoto(); document.getElementById("inp-name").value = ""; clearInfo(); });
                } else {
                    Swal.fire('Lỗi từ Server', data.msg || 'Gửi thất bại', 'error');
                }
            })
            .catch(err => {
                Swal.fire('Lỗi mạng', 'Không thể gửi dữ liệu đến GAS Webhook.', 'error');
            });
        }
    </script>
</body>
</html>
